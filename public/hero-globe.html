document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

code-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\/style>\n  <style>/* ============================================================\n   Vitor Gomes Design System \u2014 Colors\n   A light-first, monochrome system. Ink (#141416) on paper\n   (#FAFAFA), a cool neutral gray ramp between them, and ONE\n   reserved accent (green) that is opt-in \u2014 off by default.\n   \"Monochrome by default; switch the accent on to bring the\n   reserved green into play.\" Restraint is the brand.\n   ============================================================ */\n\n:root {\n  /* --- Ink \u2192 paper ramp (cool neutral grays) --- */\n  --ink-950: #0b0b0c; /* deepest \u2014 selection, max contrast */\n  --ink-900: #141416; /* primary ink \u2014 text, primary surfaces */\n  --ink-850: #1a1a1d; /* elevated dark surface (menus on dark) */\n  --ink-800: #252528; /* dark hairline / dark hover */\n  --gray-600: #54545a; /* body text / secondary */\n  --gray-500: #717177; /* muted labels */\n  --gray-400: #97979c; /* faint / placeholder / on-dark muted */\n  --gray-300: #bbbbc0; /* disabled text, mute borders */\n  --gray-200: #d6d6d9; /* default borders */\n  --gray-150: #e9e9eb; /* hairline borders, tracks */\n  --gray-100: #efeff0; /* sunken stripe */\n  --gray-50:  #f4f4f5; /* subtle fill / hover tint */\n  --paper:    #fafafa; /* page + card surface */\n  --white:    #ffffff;\n\n  /* --- Reserved accent: GREEN (opt-in) --- */\n  --green-700: #0c1f15; /* ink on green (dark) */\n  --green-600: #2f6f4f; /* accent on LIGHT surfaces */\n  --green-400: #54b084; /* accent on DARK surfaces */\n  --green-tint-light: #eaf1ed;\n  --green-tint-dark:  #16271d;\n\n  /* --- Destructive (single warm red, two tones) --- */\n  --red-600: #a33a2e; /* on light surfaces */\n  --red-400: #e0816f; /* on dark surfaces */\n\n  /* ===========================================================\n     SEMANTIC ALIASES \u2014 reference these in components\n     =========================================================== */\n\n  /* Text (on light) */\n  --text-primary:   var(--ink-900);\n  --text-secondary: var(--gray-600);\n  --text-muted:     var(--gray-500);\n  --text-faint:     var(--gray-400);\n  --text-disabled:  var(--gray-300);\n  --text-on-ink:    var(--paper); /* paper text on dark surfaces */\n\n  /* Text (on dark) */\n  --text-inverse-primary: var(--paper);\n  --text-inverse-muted:   var(--gray-400);\n  --text-inverse-faint:   var(--gray-500);\n\n  /* Surfaces */\n  --surface-page:   var(--paper);\n  --surface-card:   var(--paper);\n  --surface-subtle: var(--gray-50);  /* hover tint, selected row */\n  --surface-sunken: var(--gray-100);\n  --surface-ink:    var(--ink-900);  /* dark sections, primary btn */\n  --surface-ink-2:  var(--ink-850);  /* elevated dark (menu) */\n  --surface-ink-3:  var(--ink-800);  /* dark hover / selected */\n\n  /* Borders \u2014 edges do the work, not shadows */\n  --border-hairline: var(--gray-150); /* default card / divider */\n  --border-default:  var(--gray-200);\n  --border-mute:     var(--gray-300); /* secondary button outline */\n  --border-strong:   var(--ink-900);  /* emphasis / focused field */\n  --border-on-ink:   var(--ink-800);  /* hairline on dark */\n  --border-on-ink-2: var(--gray-600); /* visible outline on dark */\n\n  /* Accent \u2014 MONOCHROME by default (accent === ink) */\n  --accent:           var(--ink-900); /* accent on light surfaces */\n  --accent-ink:       var(--paper);   /* text/icon on the accent */\n  --accent-tint:      var(--gray-50); /* faint accent wash */\n  --accent-on-dark:   var(--paper);   /* accent when on dark surfaces */\n  --accent-on-dark-ink: var(--ink-900);\n  --accent-tint-dark: var(--ink-800);\n\n  /* Feedback */\n  --danger:         var(--red-600);\n  --danger-on-dark: var(--red-400);\n\n  /* Overlay */\n  --scrim: rgba(20, 20, 22, 0.55);\n\n  /* Focus ring \u2014 a crisp outline, never a glow */\n  --ring: var(--accent);\n  --ring-width: 2px;\n  --ring-offset: 2px;\n}\n\n/* ============================================================\n   ACCENT SCOPE \u2014 opt in to the reserved green by adding\n   data-accent=\"green\" to any container (or <html>).\n   ============================================================ */\n[data-accent=\"green\"] {\n  --accent:           var(--green-600);\n  --accent-ink:       var(--paper);\n  --accent-tint:      var(--green-tint-light);\n  --accent-on-dark:   var(--green-400);\n  --accent-on-dark-ink: var(--green-700);\n  --accent-tint-dark: var(--green-tint-dark);\n  --ring: var(--green-600);\n}\n<\/style>\n  <style>/* ============================================================\n   Vitor Gomes Design System \u2014 Typography\n   Display + UI + Body : Archivo  (grotesque, tight, confident)\n   Labels / eyebrows / data : JetBrains Mono (uppercase, tracked)\n   One sans, one mono. No serif. The mono is the \"voice\" of the\n   system \u2014 it labels everything.\n   ============================================================ */\n\n:root {\n  /* Families */\n  --font-sans: 'Archivo', system-ui, -apple-system, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;\n  /* --font-display is the same family \u2014 Archivo carries display too */\n  --font-display: var(--font-sans);\n\n  /* Weights (Archivo: 300\u2013800) */\n  --fw-light:    300; /* @kind font */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-extra:    800; /* @kind font */\n\n  /* Type scale (px-derived, matches the component library) */\n  --text-2xs: 0.625rem;  /* 10px \u2014 mono micro labels */\n  --text-xs:  0.6875rem; /* 11px \u2014 mono eyebrows */\n  --text-sm:  0.8125rem; /* 13px \u2014 small UI / mono data */\n  --text-ui:  0.875rem;  /* 14px \u2014 button + body-tight + input */\n  --text-base:0.9375rem; /* 15px \u2014 section body copy */\n  --text-md:  1.0625rem; /* 17px \u2014 accordion title */\n  --text-lg:  1.125rem;  /* 18px \u2014 lead paragraph */\n  --text-xl:  1.375rem;  /* 22px \u2014 card heading */\n  --text-2xl: 1.875rem;  /* 30px \u2014 section heading */\n  --text-3xl: 2.875rem;  /* 46px \u2014 big stat */\n  --text-hero:4.5rem;    /* 72px \u2014 hero display (clamp at use) */\n\n  /* Line heights */\n  --leading-hero:   0.98;\n  --leading-tight:  1.05;\n  --leading-snug:   1.18;\n  --leading-normal: 1.55;\n  --leading-relaxed:1.6;\n\n  /* Letter spacing */\n  --tracking-hero:   -0.03em;\n  --tracking-tight:  -0.02em;\n  --tracking-snug:   -0.01em;\n  --tracking-normal: 0;\n  --tracking-label:  0.08em;  /* mono labels */\n  --tracking-eyebrow:0.1em;   /* mono eyebrows */\n  --tracking-caps:   0.14em;  /* masthead / wordmark */\n}\n\n/* ---- Helper classes (consumers may use directly) ---- */\n.vg-hero {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: clamp(2.375rem, 6vw, 4.5rem); /* 38 \u2192 72 */\n  line-height: var(--leading-hero);\n  letter-spacing: var(--tracking-hero);\n  color: var(--text-primary);\n}\n.vg-h2 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-semibold);\n  font-size: var(--text-2xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--text-primary);\n}\n.vg-eyebrow {\n  font-family: var(--font-mono);\n  font-size: var(--text-xs);\n  font-weight: var(--fw-medium);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n.vg-body {\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  font-weight: var(--fw-regular);\n  line-height: var(--leading-relaxed);\n  color: var(--text-secondary);\n}\n.vg-mono {\n  font-family: var(--font-mono);\n  font-size: var(--text-sm);\n  letter-spacing: var(--tracking-label);\n}\n<\/style>\n<\/helmet
